name: Workspace checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Emit formatted source payload (temporary, synthetic only)
        run: |
          for file in packages/core/src/chunks.ts packages/core/src/chunks.test.ts packages/db/src/chunks.ts packages/db/src/chunks.integration.test.ts; do
            echo "PCE_FMT_START:$file"
            npx prettier "$file" | base64 -w0
            echo
            echo "PCE_FMT_END:$file"
          done
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Bundle Expo Android JS without a simulator
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/pce-expo-export
      - name: API and worker process smoke
        run: |
          node apps/api/dist/main.js > /tmp/pce-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health > /tmp/pce-health.json; then break; fi
            sleep 0.5
          done
          node -e "const fs=require('fs'); const result=JSON.parse(fs.readFileSync('/tmp/pce-health.json')); if(result.status!=='ok') process.exit(1)"
          node apps/worker/dist/main.js > /tmp/pce-worker.log 2>&1 &
          worker_pid=$!
          sleep 1
          kill -TERM "$worker_pid"
          wait "$worker_pid"
          grep -q 'Worker scaffold stopped' /tmp/pce-worker.log
