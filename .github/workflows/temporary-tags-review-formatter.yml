# Temporary, branch-only formatter for review corrections. Remove after run.
name: Temporary tags review formatter
on:
  push:
    branches:
      - feat/103-manual-note-tags
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[remote-format]') && !contains(github.event.head_commit.message, '[remove-remote-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/103-manual-note-tags
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write apps/web/src/App.tsx packages/db/src/note-tags.integration.test.ts
      - name: Commit formatting on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx packages/db/src/note-tags.integration.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(tags): format remote review corrections [remote-format]"
          git push origin HEAD:feat/103-manual-note-tags
