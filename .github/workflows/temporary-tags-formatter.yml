# TEMPORARY: scoped to feature branch, remove immediately after formatting.
name: Temporary tags formatting
on:
  push:
    branches:
      - feat/103-manual-note-tags

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[remote-format]') && !contains(github.event.head_commit.message, '[remove-remote-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/103-manual-note-tags
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prettier only changed feature source files
        run: >-
          npx prettier --write
          apps/api/src/app.ts
          apps/api/src/note-tags.integration.test.ts
          apps/web/src/App.tsx
          packages/contracts/src/index.ts
          packages/db/src/index.ts
          packages/db/src/note-tags.integration.test.ts
          packages/db/src/note-tags.ts
          packages/db/src/search.ts
      - name: Commit formatter output to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts apps/api/src/note-tags.integration.test.ts apps/web/src/App.tsx packages/contracts/src/index.ts packages/db/src/index.ts packages/db/src/note-tags.integration.test.ts packages/db/src/note-tags.ts packages/db/src/search.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(tags): normalize changed files with Prettier [remote-format]"
          git push origin HEAD:feat/103-manual-note-tags
