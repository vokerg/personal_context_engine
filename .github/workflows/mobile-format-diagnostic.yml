name: Mobile formatter diagnostic (temporary)
on:
  push:
    branches: [feat/123-ios-native-app-shell]
permissions:
  contents: read
jobs:
  format-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Format changed mobile source and print encoded snapshots
        shell: bash
        run: |
          npx prettier --write apps/mobile/App.tsx apps/mobile/navigation.test.ts apps/mobile/screen-state.ts apps/mobile/screens.tsx apps/mobile/theme.test.ts apps/mobile/theme.ts apps/mobile/ui.tsx
          for f in apps/mobile/App.tsx apps/mobile/navigation.test.ts apps/mobile/screen-state.ts apps/mobile/screens.tsx apps/mobile/theme.test.ts apps/mobile/theme.ts apps/mobile/ui.tsx; do
            echo "PCE_FORMAT_START:$f"
            base64 -w0 "$f"
            echo
            echo "PCE_FORMAT_END:$f"
          done
