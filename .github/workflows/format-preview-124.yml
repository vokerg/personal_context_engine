name: Temporary formatting diagnostic for PR 136
on:
  push:
    branches: ["feat/124-ios-timeline-search"]
permissions:
  contents: read
jobs:
  format-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Print formatted mobile code for connector handoff
        run: |
          npx prettier --write apps/mobile/feed-screens.tsx
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          console.log('PCE_FORMAT_124::apps/mobile/feed-screens.tsx::' + readFileSync('apps/mobile/feed-screens.tsx').toString('base64'));
          JS
