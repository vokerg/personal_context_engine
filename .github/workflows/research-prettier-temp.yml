name: Temporary research branch formatting
on:
  push:
    branches: [feat/104-research-ingress]
    paths: [.github/workflows/research-prettier-temp.yml]
permissions: {contents: write}
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write apps/worker/src/content-store/github.test.ts apps/worker/src/content-store/github.ts
      - name: Commit formatting only on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/content-store/github.test.ts apps/worker/src/content-store/github.ts
          git diff --cached --quiet || git commit -m "style(research): normalize optimized importer formatting"
          git push origin HEAD:feat/104-research-ingress
