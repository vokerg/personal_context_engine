name: Temporary research branch formatting
on:
  push:
    branches: [feat/104-research-ingress]
    paths: [.github/workflows/research-prettier-temp.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write apps/worker/src/content-store/github.test.ts apps/worker/src/content-store/github.ts apps/worker/src/main.ts apps/worker/src/research-ingress.test.ts apps/worker/src/research-ingress.ts
      - name: Commit formatting only to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/content-store/github.test.ts apps/worker/src/content-store/github.ts apps/worker/src/main.ts apps/worker/src/research-ingress.test.ts apps/worker/src/research-ingress.ts
          git diff --cached --quiet || git commit -m "style(research): normalize TypeScript formatting"
          git push origin HEAD:feat/104-research-ingress
