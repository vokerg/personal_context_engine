name: Temporary format for issue 4

on:
  push:
    branches: ['chore/issue-4-workspaces']

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'vokerg/personal_context_engine' && github.actor == 'vokerg'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply project formatter
        run: npm exec -- prettier --write "{apps,packages}/**/*.{ts,tsx,json}" "*.{json,mjs}"
      - name: Commit formatting to feature branch
        run: |
          test "$GITHUB_REF" = "refs/heads/chore/issue-4-workspaces"
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages package.json tsconfig.base.json eslint.config.mjs
          git commit -m "style: format workspace scaffold (#4)"
          git push origin HEAD:chore/issue-4-workspaces
