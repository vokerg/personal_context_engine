name: Package independent GCP PCE API (no deploy)
on:
  pull_request:
    paths:
      - "deploy/gcp/**"
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/gcp-api-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate API operator scripts
        run: |
          bash -n deploy/gcp/package-api.sh
          bash -n deploy/gcp/api-bootstrap.sh
          bash -n deploy/gcp/api-install.sh
      - name: Verify installer recovery with synthetic archives
        run: node --test deploy/gcp/api-install.node-test.mjs
      - run: npm ci --no-audit --no-fund
      - name: Build and verify portable API artifact
        run: bash deploy/gcp/package-api.sh "$RUNNER_TEMP/api-artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: pce-gcp-api-${{ github.sha }}
          path: |
            ${{ runner.temp }}/api-artifact/api.tar.gz
            ${{ runner.temp }}/api-artifact/api.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error
