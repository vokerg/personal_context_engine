name: One-time trusted lockfile bootstrap

on:
  push:
    branches: ['chore/issue-4-workspaces']

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if [ -f package-lock.json ]; then exit 0; fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile on feature branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/chore/issue-4-workspaces'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f package-lock.json ]; then exit 0; fi
          git add package-lock.json
          git commit -m 'chore: generate npm lockfile for issue 4'
          git push origin HEAD:chore/issue-4-workspaces
