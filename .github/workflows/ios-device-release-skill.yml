name: iPhone Release skill checks

on:
  pull_request:
    paths:
      - ".agents/skills/ios-device-release/**"
      - ".github/workflows/ios-device-release-skill.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/ios-device-release/**"
      - ".github/workflows/ios-device-release-skill.yml"

permissions:
  contents: read

jobs:
  helper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --check .agents/skills/ios-device-release/scripts/install.mjs
      - run: node --test .agents/skills/ios-device-release/scripts/validate.mjs
