name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check documentation structure and links
        run: node scripts/check-docs.mjs

  # Temporary #134 formatter diagnostic. Remove before merge.
  format-dump:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 134
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Format changed code for review
        shell: bash
        run: |
          files=(
            apps/api/src/app.ts
            apps/api/src/main.ts
            apps/api/src/oauth.ts
            apps/api/src/oauth.test.ts
            apps/api/src/native-oauth.integration.test.ts
            apps/mobile/App.tsx
            apps/mobile/native-auth.ts
            apps/mobile/session.ts
            apps/mobile/session.test.ts
          )
          npx prettier --write "${files[@]}" >/dev/null
          for file in "${files[@]}"; do
            echo "PCE_FORMAT_BEGIN:${file}"
            base64 "${file}"
            echo "PCE_FORMAT_END:${file}"
          done
