name: Mobile review formatter (temporary)
on:
  push:
    branches: [feat/123-ios-native-app-shell]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Produce formatted synthetic render test
        shell: bash
        run: |
          npx prettier --write apps/mobile/shell.render.test.tsx
          echo PCE_FORMAT_START
          base64 -w0 apps/mobile/shell.render.test.tsx
          echo
          echo PCE_FORMAT_END
