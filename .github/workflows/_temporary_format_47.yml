name: Temporary PR formatting preview
on:
  push:
    branches:
      - feat/47-embeddings-worker
jobs:
  print-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Print formatted base64 of changed TypeScript files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/worker/src/embeddings.test.ts
            apps/worker/src/embeddings.ts
            apps/worker/src/main.ts
            packages/db/src/embedding-jobs.integration.test.ts
            packages/db/src/embedding-jobs.ts
            packages/db/src/index.ts
          )
          npx prettier --write "${files[@]}" >/dev/null
          for file in "${files[@]}"; do
            echo "FORMAT_START:${file}"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END:${file}"
          done
