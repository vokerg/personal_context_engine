name: Temporary formatter inspection (#125)
on:
  push:
    branches: [feat/125-ios-note-research-detail]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Emit formatted text for remote-only review
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import prettier from 'prettier';
          const paths = [
            'apps/mobile/App.tsx',
            'apps/mobile/detail-model.ts',
            'apps/mobile/detail-screen.tsx',
            'apps/mobile/detail-contract.test.ts',
            'apps/mobile/detail-model.test.ts',
            'apps/mobile/detail-screen.render.test.tsx',
            'apps/mobile/navigation.ts',
            'apps/mobile/navigation.test.ts',
            'apps/mobile/screens.tsx',
          ];
          for (const path of paths) {
            const input = await fs.readFile(path, 'utf8');
            const content = await prettier.format(input, {
              ...(await prettier.resolveConfig(path)),
              filepath: path,
            });
            console.log('PCE_FORMAT:' + JSON.stringify({ path, content }));
          }
          NODE
