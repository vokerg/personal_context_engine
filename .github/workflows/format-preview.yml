name: Temporary capture formatter diagnostic
on:
  pull_request:
    paths:
      - 'packages/core/src/capture.ts'
      - 'packages/core/src/capture.test.ts'
      - '.github/workflows/format-preview.yml'

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Emit synthetic source formatted by repository Prettier
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import prettier from 'prettier';
          for (const [key, file] of [
            ['CAPTURE', 'packages/core/src/capture.ts'],
            ['TEST', 'packages/core/src/capture.test.ts'],
          ]) {
            const formatted = await prettier.format(fs.readFileSync(file, 'utf8'), { filepath: file });
            console.log('PCE_FORMATTED_' + key + '=' + JSON.stringify(formatted));
          }
          NODE
